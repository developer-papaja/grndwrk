# The grndwrk relay, on your own Cloudflare account (the free plan is enough).
# `grndwrk relay deploy` fills in the name and sets TEAM_AUTH as a secret.
name = "grndwrk-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayObject"]
