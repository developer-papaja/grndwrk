<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groundwork</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%225%22 fill=%22%23c9c98a%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-ink text-fog antialiased" x-data>
    <div id="scene" class="fixed inset-0"></div>

    <!-- Status -->
    <div class="pointer-events-none fixed left-4 top-4 flex items-center gap-3 text-sm">
      <span class="font-medium tracking-wide text-fog/90" x-text="$store.gw.project.name || 'Groundwork'"></span>
      <span class="flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs text-fog/70">
        <span class="size-2 rounded-full" :class="$store.gw.live ? 'bg-emerald-400' : 'bg-amber-400 animate-pulse'"></span>
        <span x-text="$store.gw.live ? 'live' : 'connecting'"></span>
        <span class="text-fog/40">·</span>
        <span id="count" x-text="$store.gw.count + ($store.gw.count === 1 ? ' node' : ' nodes')"></span>
      </span>
    </div>

    <!-- Link mode banner -->
    <div
      x-cloak
      x-show="$store.gw.mode === 'link'"
      class="pointer-events-none fixed inset-x-0 top-4 flex justify-center px-4"
      :class="$store.gw.selected && 'with-panel'"
    >
      <div id="link-banner" class="rounded-full border border-amber-300/30 bg-amber-300/10 px-4 py-1.5 text-xs text-amber-100">
        Link mode: click nodes to link or unlink them from
        <span class="font-medium" x-text="$store.gw.selected?.title"></span>. Esc or L to stop.
      </div>
    </div>

    <!-- Notes -->
    <div
      x-cloak
      x-show="$store.gw.note"
      x-transition.opacity
      class="fixed bottom-24 left-1/2 -translate-x-1/2 rounded-md border border-white/10 bg-panel px-3 py-2 text-xs text-fog/80"
      x-text="$store.gw.note"
    ></div>

    <!-- Capture bar -->
    <div class="pointer-events-none fixed inset-x-0 bottom-6 flex justify-center px-4" :class="$store.gw.selected && 'with-panel'">
    <form class="pointer-events-auto w-full max-w-[640px]" @submit.prevent="$store.gw.submitCapture()">
      <div class="flex items-center gap-2 rounded-xl border border-white/10 bg-panel/95 px-3 py-2 shadow-2xl shadow-black/40 backdrop-blur focus-within:border-white/25">
        <template x-if="$store.gw.selected && !$store.gw.selected.error && $store.gw.captureLinked">
          <span class="flex max-w-[45%] shrink-0 items-center gap-1 rounded-md bg-white/8 py-0.5 pl-2 pr-1 text-xs text-fog/70">
            <span class="truncate">linked to: <span x-text="$store.gw.selected.title"></span></span>
            <button
              type="button"
              class="rounded px-1 text-fog/50 hover:bg-white/10 hover:text-fog"
              title="Capture without linking"
              @click="$store.gw.captureLinked = false; $refs.capture.focus()"
            >×</button>
          </span>
        </template>
        <input
          id="capture"
          x-ref="capture"
          x-model="$store.gw.capture"
          autocomplete="off"
          spellcheck="false"
          placeholder="Capture a thought. ? for a question, ! for a decision"
          class="min-w-0 flex-1 bg-transparent py-1 text-sm text-fog placeholder:text-fog/35 focus:outline-none"
        />
      </div>
      <p class="mt-2 text-center text-[11px] text-fog/35">
        N capture · L link · Delete remove · Esc back
      </p>
    </form>
    </div>

    <!-- Side panel -->
    <aside
      x-cloak
      x-show="$store.gw.selected"
      x-transition:enter="transition duration-150"
      x-transition:enter-start="translate-x-4 opacity-0"
      class="fixed bottom-4 right-4 top-4 flex w-[min(360px,calc(100vw-2rem))] flex-col overflow-y-auto rounded-xl border border-white/10 bg-panel/95 p-4 text-sm shadow-2xl shadow-black/40 backdrop-blur"
    >
      <template x-if="$store.gw.selected?.error">
        <div class="space-y-3">
          <div class="flex items-start justify-between gap-3">
            <h2 class="font-medium text-rose-200" x-text="$store.gw.selected.id + '.md cannot be read'"></h2>
            <button class="text-fog/40 hover:text-fog" @click="$store.gw.select(null)" title="Close (Esc)">×</button>
          </div>
          <p class="text-xs text-fog/60" x-text="$store.gw.selected.error"></p>
          <p class="text-xs text-fog/60">Fix the frontmatter in the file by hand. The map updates as soon as it parses again.</p>
          <pre class="whitespace-pre-wrap rounded-md bg-black/30 p-3 text-xs text-fog/70" x-text="$store.gw.selected.body"></pre>
        </div>
      </template>

      <template x-if="$store.gw.selected && !$store.gw.selected.error">
        <div class="flex flex-1 flex-col gap-4">
          <div class="flex items-start gap-2">
            <textarea
              id="field-title"
              rows="2"
              x-model="$store.gw.draft.title"
              @input="$store.gw.edit('title')"
              @focus="$store.gw.focusField('title')"
              @blur="$store.gw.blurField('title')"
              @keydown.enter.prevent="$event.target.blur()"
              class="field flex-1 resize-none text-base font-medium"
            ></textarea>
            <button class="px-1 text-lg leading-none text-fog/40 hover:text-fog" @click="$store.gw.select(null)" title="Close (Esc)">×</button>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <label class="block">
              <span class="label">Type</span>
              <select
                id="field-type"
                x-model="$store.gw.draft.type"
                @change="$store.gw.edit('type', true)"
                class="field w-full"
              >
                <template x-for="t in $store.gw.types" :key="t">
                  <option :value="t" x-text="t" :selected="t === $store.gw.draft.type"></option>
                </template>
              </select>
            </label>
            <label class="block">
              <span class="label">Status</span>
              <select
                id="field-status"
                x-model="$store.gw.draft.status"
                @change="$store.gw.edit('status', true)"
                class="field w-full"
              >
                <template x-for="s in $store.gw.statuses" :key="s">
                  <option :value="s" x-text="s" :selected="s === $store.gw.draft.status"></option>
                </template>
              </select>
            </label>
          </div>

          <div>
            <span class="label">Altitude: 5 is abstract, 1 is concrete</span>
            <div class="flex gap-1" id="field-altitude">
              <template x-for="a in [1, 2, 3, 4, 5]" :key="a">
                <button
                  type="button"
                  class="flex-1 rounded-md border py-1 text-xs"
                  :class="$store.gw.draft.altitude === a ? 'border-white/30 bg-white/15 text-fog' : 'border-white/10 text-fog/50 hover:bg-white/5'"
                  :data-altitude="a"
                  @click="$store.gw.draft.altitude = a; $store.gw.edit('altitude', true)"
                  x-text="a"
                ></button>
              </template>
            </div>
          </div>

          <label class="flex flex-1 flex-col">
            <span class="label">Notes</span>
            <textarea
              id="field-body"
              x-model="$store.gw.draft.body"
              @input="$store.gw.edit('body')"
              @focus="$store.gw.focusField('body')"
              @blur="$store.gw.blurField('body')"
              placeholder="Thoughts, references, half formed questions"
              class="field min-h-32 flex-1 resize-none leading-relaxed"
            ></textarea>
          </label>

          <div>
            <div class="mb-1 flex items-center justify-between">
              <span class="label mb-0">Links</span>
              <button
                type="button"
                class="rounded-md px-2 py-0.5 text-xs"
                :class="$store.gw.mode === 'link' ? 'bg-amber-300/15 text-amber-100' : 'text-fog/50 hover:bg-white/5 hover:text-fog'"
                @click="$store.gw.toggleLinkMode()"
                x-text="$store.gw.mode === 'link' ? 'Done linking' : 'Link (L)'"
              ></button>
            </div>
            <p x-show="$store.gw.linkedNodes.length === 0" class="text-xs text-fog/35">No links yet.</p>
            <ul class="space-y-1" id="links">
              <template x-for="n in $store.gw.linkedNodes" :key="n.id">
                <li class="group flex items-center gap-2">
                  <button class="min-w-0 flex-1 truncate rounded px-1 text-left text-fog/75 hover:bg-white/5 hover:text-fog" @click="$store.gw.select(n.id)" x-text="n.title"></button>
                  <button class="px-1 text-fog/30 opacity-0 hover:text-fog group-hover:opacity-100" title="Unlink" @click="$store.gw.toggleLink(n.id)">×</button>
                </li>
              </template>
            </ul>
          </div>

          <div class="flex items-center justify-between border-t border-white/5 pt-3 text-xs text-fog/35">
            <span x-text="$store.gw.selected.id + ' · ' + $store.gw.selected.created"></span>
            <button
              id="delete"
              type="button"
              class="rounded-md px-2 py-1"
              :class="$store.gw.deleteArmed ? 'bg-rose-400/20 text-rose-100' : 'hover:bg-white/5 hover:text-rose-200'"
              @click="$store.gw.requestDelete()"
              x-text="$store.gw.deleteArmed ? 'Press again to remove' : 'Delete'"
            ></button>
          </div>
        </div>
      </template>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
