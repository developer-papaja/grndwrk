<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groundwork</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%225%22 fill=%22%230d99ff%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-ink text-fog antialiased" x-data>
    <!-- Icons: Heroicons 24 outline (MIT), plus a panel toggle drawn to match. -->
    <svg class="hidden" aria-hidden="true">
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5v15m7.5-7.5h-15" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" /></symbol>
      <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" /></symbol>
      <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 13.5 12 21m0 0-7.5-7.5M12 21V3" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6l12 12" /></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5" /><path d="M9.5 5v14" /></symbol>
      <symbol id="i-panel-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5" /><path d="M14.5 5v14" /></symbol>
      <symbol id="i-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0Z" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.35 3.836c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m8.9-4.414c.376.023.75.05 1.124.08 1.131.094 1.976 1.057 1.976 2.192V16.5A2.25 2.25 0 0 1 18 18.75h-2.25m-7.5-10.5H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V18.75m-7.5-10.5h6.375c.621 0 1.125.504 1.125 1.125v9.375m-8.25-3 1.5 1.5 3-3.75" /></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" /></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.25 13.5h3.86a2.25 2.25 0 0 1 2.012 1.244l.256.512a2.25 2.25 0 0 0 2.013 1.244h3.218a2.25 2.25 0 0 0 2.013-1.244l.256-.512a2.25 2.25 0 0 1 2.013-1.244h3.859m-19.5.338V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 0 0-2.15-1.588H6.911a2.25 2.25 0 0 0-2.15 1.588L2.35 13.177a2.25 2.25 0 0 0-.1.661Z" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z" /></symbol>
    </svg>

    <div id="scene" class="fixed inset-y-0" :class="!['map', 'focus'].includes($store.gw.view) && 'invisible'"></div>

    <!-- Views rail -->
    <nav id="rail" class="fixed inset-y-0 left-0 z-10 flex w-16 flex-col items-center gap-2 border-r border-line bg-ink pt-3">
      <template x-for="v in [['focus', 'Focus: only what needs you', 'i-inbox'], ['map', 'Map', 'i-map'], ['readiness', 'Readiness', 'i-check'], ['deliverables', 'Deliverables', 'i-doc']]" :key="v[0]">
        <button
          class="relative grid size-10 place-items-center rounded-lg"
          :class="$store.gw.view === v[0] ? 'bg-white/10 text-fog' : 'text-fog/55 hover:bg-white/5 hover:text-fog'"
          :id="'rail-' + v[0]"
          :title="v[1]"
          :aria-label="v[1]"
          @click="v[0] === 'focus' ? $store.gw.enterFocus() : $store.gw.setView(v[0])"
        >
          <svg class="size-5"><use :href="'#' + v[2]" /></svg>
          <span
            x-show="v[0] === 'focus' && $store.gw.focusQueue.length"
            class="absolute -right-1 -top-1 grid h-4 min-w-4 place-items-center rounded-full bg-accent px-1 text-[10px] font-semibold text-white"
            x-text="$store.gw.focusQueue.length"
          ></span>
          <span
            x-show="v[0] === 'readiness' && $store.gw.blockingCount"
            class="absolute -right-1 -top-1 grid size-4 place-items-center rounded-full bg-rose-500 text-[10px] font-semibold text-white"
            x-text="$store.gw.blockingCount"
          ></span>
        </button>
      </template>
    </nav>

    <!-- List: docked on the left, or a small pill when collapsed -->
    <aside
      x-cloak
      x-show="$store.gw.view === 'map' && $store.gw.listOpen"
      class="fixed inset-y-0 left-16 flex w-[320px] max-w-full flex-col border-r border-line bg-panel text-[13px]"
    >
      <div class="flex items-start justify-between gap-3 px-4 pb-3 pt-4">
        <div class="min-w-0">
          <div class="truncate text-[15px] font-semibold text-fog" x-text="$store.gw.project.name || 'Groundwork'"></div>
          <div class="mt-1 flex items-center gap-1.5 text-xs text-fog/55">
            <span class="size-1.5 rounded-full" :class="$store.gw.live ? 'bg-emerald-400' : 'animate-pulse bg-amber-400'"></span>
            <span x-text="$store.gw.live ? 'Live' : 'Offline, start groundwork in your terminal'"></span>
            <span class="text-fog/30">·</span>
            <span id="count" x-text="$store.gw.count + ($store.gw.count === 1 ? ' node' : ' nodes')"></span>
          </div>
          <button
            x-show="$store.gw.questionIds.length"
            id="questions"
            class="mt-2 flex items-center gap-1.5 rounded-md bg-question/15 px-2 py-1 text-xs text-question hover:bg-question/25"
            title="Open the next card with a question"
            @click="$store.gw.nextQuestion()"
          >
            <span class="size-1.5 rounded-full bg-question"></span>
            <span x-text="$store.gw.questionIds.length + ($store.gw.questionIds.length === 1 ? ' question for you' : ' questions for you')"></span>
          </button>
          <button
            id="kickoff-chip"
            class="mt-2 flex items-center gap-1.5 rounded-md px-2 py-1 text-xs"
            :class="$store.gw.kickoffCurrent ? 'bg-accent/15 text-sky-300 hover:bg-accent/25' : 'bg-emerald-400/15 text-emerald-300 hover:bg-emerald-400/25'"
            title="Where the kickoff stands"
            @click="$store.gw.setView('readiness')"
            x-text="$store.gw.kickoffLabel"
          ></button>

        </div>
        <button id="list-button" class="icon-btn" title="Hide panel" @click="$store.gw.setListOpen(false)">
          <svg class="size-5"><use href="#i-panel" /></svg>
        </button>
      </div>

      <div class="border-t border-line"></div>

      <div class="flex items-center justify-between px-4 pb-1 pt-3">
        <span class="font-semibold text-fog">Pages</span>
        <button class="icon-btn -mr-1.5" title="Add a page" @click="$store.gw.addingPage = true; $nextTick(() => document.getElementById('new-page').focus())">
          <svg class="size-[18px]"><use href="#i-plus" /></svg>
        </button>
      </div>
      <div class="px-2 pb-2" id="pages">
        <button
          class="flex h-8 w-full items-center justify-between rounded-md px-2"
          :class="$store.gw.onAll ? 'bg-white/10 font-medium text-fog' : 'text-fog/70 hover:bg-white/5'"
          @click="$store.gw.showPage('*')"
        >
          <span>All</span>
          <span class="text-xs text-fog/35" x-text="$store.gw.count"></span>
        </button>
        <template x-for="p in $store.gw.pageNames" :key="p">
          <button
            class="flex h-8 w-full items-center justify-between rounded-md px-2"
            :class="!$store.gw.onAll && $store.gw.currentPage.toLowerCase() === p.toLowerCase() ? 'bg-white/10 font-medium text-fog' : 'text-fog/70 hover:bg-white/5'"
            @click="$store.gw.showPage(p)"
          >
            <span class="truncate" x-text="p"></span>
            <span class="text-xs text-fog/35" x-text="$store.gw.pageCount(p)"></span>
          </button>
        </template>
        <form x-show="$store.gw.addingPage" class="px-1 pt-1" @submit.prevent="$store.gw.addPage()">
          <input
            id="new-page"
            x-model="$store.gw.newPage"
            @blur="$store.gw.addPage()"
            @keydown.escape.prevent.stop="$store.gw.newPage = ''; $store.gw.addingPage = false"
            autocomplete="off"
            placeholder="Page name"
            class="field w-full"
          />
        </form>
      </div>

      <div class="border-t border-line"></div>

      <div class="flex items-center justify-between px-4 pb-1 pt-3">
        <span class="flex items-center gap-2">
          <span class="font-semibold text-fog">Topics</span>
          <button
            x-show="$store.gw.attentionCount || $store.gw.onlyAttention"
            id="attention"
            class="rounded px-1.5 py-0.5 text-[11px]"
            :class="$store.gw.onlyAttention ? 'bg-question text-ink' : 'bg-question/15 text-question hover:bg-question/25'"
            :title="$store.gw.onlyAttention ? 'Show all topics' : 'Show only topics that are thin or have missing pieces'"
            @click="$store.gw.onlyAttention = !$store.gw.onlyAttention"
            x-text="$store.gw.attentionCount + ' thin'"
          ></button>
        </span>
        <span class="-mr-1.5 flex items-center">
          <button class="icon-btn" :class="$store.gw.searchOpen && 'text-fog'" title="Search ( / )" @click="$store.gw.searchOpen ? $store.gw.leaveSearch() : $store.gw.openList()">
            <svg class="size-[18px]"><use href="#i-search" /></svg>
          </button>
          <button class="icon-btn" title="Add a thought ( N )" @click="document.getElementById('capture').focus()">
            <svg class="size-[18px]"><use href="#i-plus" /></svg>
          </button>
        </span>
      </div>

      <div x-show="$store.gw.searchOpen" class="px-3 pb-2 pt-1">
        <input
          id="search"
          x-model="$store.gw.query"
          @input="$store.gw.listIndex = 0"
          @keydown.down.prevent="$store.gw.moveList(1)"
          @keydown.up.prevent="$store.gw.moveList(-1)"
          @keydown.enter.prevent="$store.gw.chooseRow()"
          @keydown.escape.prevent.stop="$store.gw.leaveSearch(); $event.target.blur()"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search titles, notes and topics"
          class="field w-full"
        />
      </div>

      <div class="flex-1 overflow-y-auto px-2 pb-24" id="list">
        <p x-show="$store.gw.listRows.length === 0 && $store.gw.query" class="px-3 py-2 text-xs text-fog/40">Nothing matches.</p>
        <template x-for="group in $store.gw.listGroups" :key="group.key">
          <section>
            <button
              class="flex h-8 w-full items-center justify-between rounded-md pl-1 pr-2 text-fog/85 hover:bg-white/5"
              @click="$store.gw.toggleGroup(group.key)"
              :aria-expanded="!$store.gw.isCollapsed(group.key)"
            >
              <span class="flex items-center gap-1">
                <svg class="size-4 shrink-0 text-fog/40 transition-transform duration-150" :class="!$store.gw.isCollapsed(group.key) && 'rotate-90'"><use href="#i-chevron" /></svg>
                <span x-text="$store.gw.label(group.name)"></span>
              </span>
              <span class="flex cursor-help items-center gap-2 text-xs" :title="$store.gw.topicCountHint(group.total, $store.gw.missingIn(group.key))">
                <span x-show="$store.gw.missingIn(group.key)" class="text-rose-300/80" x-text="$store.gw.missingIn(group.key) + ' missing'"></span>
                <span :class="group.total <= 2 ? 'text-amber-200/70' : 'text-fog/35'" x-text="group.total <= 2 ? group.total + ', thin' : group.total"></span>
              </span>
            </button>
            <template x-for="n in $store.gw.isCollapsed(group.key) ? [] : group.nodes" :key="n.id">
              <button
                class="flex h-8 w-full items-center gap-2 rounded-md pl-6 pr-2 text-left"
                :class="
                  $store.gw.selectedId === n.id
                    ? 'bg-accent/25 text-white'
                    : $store.gw.listRows[$store.gw.listIndex]?.id === n.id && $store.gw.query
                      ? 'bg-white/10 text-fog'
                      : $store.gw.freshIds.includes(n.id)
                        ? 'bg-white/10 text-fog'
                        : 'text-fog/70 hover:bg-white/5'
                "
                @click="$store.gw.chooseRow(n.id)"
              >
                <span class="size-1.5 shrink-0 rounded-full" :style="{ background: $store.gw.typeColors[n.type] }"></span>
                <span class="min-w-0 flex-1 truncate" :class="n.status === 'settled' && 'text-fog/45'" x-text="n.title"></span>
                <span x-show="$store.gw.hasQuestion(n.id)" class="size-1.5 shrink-0 rounded-full bg-question" title="Claude asked something"></span>
              </button>
            </template>
          </section>
        </template>
      </div>
    </aside>

    <div
      x-cloak
      x-show="$store.gw.view === 'map' && !$store.gw.listOpen"
      class="fixed left-[76px] top-3 flex items-center gap-3 rounded-2xl border border-line bg-panel py-2 pl-4 pr-2 text-[13px] shadow-md shadow-black/20"
    >
      <span class="size-1.5 rounded-full" :class="$store.gw.live ? 'bg-emerald-400' : 'animate-pulse bg-amber-400'"></span>
      <span class="font-semibold text-fog" x-text="$store.gw.project.name || 'Groundwork'"></span>
      <button id="list-show" class="icon-btn" title="Show panel" @click="$store.gw.setListOpen(true)">
        <svg class="size-5"><use href="#i-panel" /></svg>
      </button>
    </div>

    <!-- Link mode banner -->
    <div x-cloak x-show="$store.gw.view === 'map' && $store.gw.mode === 'link'" class="pointer-events-none fixed top-4 flex justify-center px-4" :style="$store.gw.mapArea">
      <div id="link-banner" class="rounded-full border border-accent/40 bg-accent/15 px-4 py-1.5 text-xs text-sky-100">
        Click cards to link or unlink them. Esc to stop.
      </div>
    </div>

    <!-- Notes -->
    <div x-cloak x-show="$store.gw.note" x-transition.opacity class="pointer-events-none fixed bottom-24 flex justify-center px-4" :style="$store.gw.mapArea">
      <div id="note" class="rounded-lg border border-line bg-panel px-3 py-2 text-xs text-fog/85 shadow-md shadow-black/20" x-text="$store.gw.note"></div>
    </div>

    <!-- Toolbar: add a thought, act on the open card, frame the map -->
    <div x-show="$store.gw.view === 'map'" class="pointer-events-none fixed bottom-5 flex justify-center px-4" :style="$store.gw.mapArea">
      <form
        class="pointer-events-auto flex max-w-full items-center gap-1 rounded-2xl border border-line bg-panel p-1.5 shadow-lg shadow-black/25"
        @submit.prevent="$store.gw.submitCapture()"
      >
        <div class="flex min-w-0 items-center gap-2 rounded-xl bg-white/5 px-3 py-1.5 focus-within:bg-white/10">
          <template x-if="$store.gw.selected && !$store.gw.selected.error && $store.gw.captureLinked">
            <span class="flex max-w-[150px] shrink-0 items-center gap-1 rounded-md bg-white/10 py-0.5 pl-2 pr-0.5 text-xs text-fog/70">
              <span class="truncate" x-text="$store.gw.selected.title"></span>
              <button type="button" class="rounded p-0.5 text-fog/50 hover:bg-white/10 hover:text-fog" title="Add without linking" @click="$store.gw.captureLinked = false; $refs.capture.focus()">
                <svg class="size-3.5"><use href="#i-close" /></svg>
              </button>
            </span>
          </template>
          <input
            id="capture"
            x-ref="capture"
            x-model="$store.gw.capture"
            autocomplete="off"
            spellcheck="false"
            :placeholder="$store.gw.count === 0 ? 'Add your first thought' : 'Add a thought'"
            title="Start with ? for a question or ! for a decision"
            class="w-[260px] min-w-0 bg-transparent py-1 text-[13px] text-fog placeholder:text-fog/40 focus:outline-none"
          />
        </div>

        <div class="mx-1 h-6 w-px bg-line"></div>

        <div id="toolbar" class="flex items-center gap-0.5" :class="!($store.gw.selected && !$store.gw.selected.error) && 'tools-off'">
          <button type="button" class="tool" :class="$store.gw.mode === 'link' && 'tool-on'" title="Link to other cards ( L )" @click="$store.gw.toggleLinkMode()">
            <svg class="size-5"><use href="#i-link" /></svg>
          </button>
          <button type="button" class="tool" title="Higher, more abstract ( ] )" @click="$store.gw.nudgeAltitude(1)">
            <svg class="size-5"><use href="#i-up" /></svg>
          </button>
          <button type="button" class="tool" title="Lower, more concrete ( [ )" @click="$store.gw.nudgeAltitude(-1)">
            <svg class="size-5"><use href="#i-down" /></svg>
          </button>
          <button type="button" class="tool" :class="$store.gw.deleteArmed && 'tool-danger'" :title="$store.gw.deleteArmed ? 'Press again to delete' : 'Delete ( Delete twice )'" @click="$store.gw.requestDelete()">
            <svg class="size-5"><use href="#i-trash" /></svg>
          </button>
        </div>

        <div class="mx-1 h-6 w-px bg-line"></div>

        <div class="rounded-xl bg-white/5 p-0.5">
          <button id="fit-button" type="button" class="tool" title="Fit the map ( F )" @click="$store.gw.fit()">
            <svg class="size-5"><use href="#i-fit" /></svg>
          </button>
        </div>
      </form>
    </div>

    <!-- Readiness view -->
    <main
      x-cloak
      x-show="$store.gw.view === 'readiness'"
      id="readiness-view"
      class="fixed inset-y-0 left-16 overflow-y-auto bg-ink text-[13px]"
      :style="{ right: $store.gw.detailsVisible ? '360px' : '0px' }"
    >
      <div class="mx-auto max-w-3xl px-8 pb-24 pt-10">
        <div class="flex items-baseline justify-between gap-4">
          <h1 class="text-xl font-semibold text-fog">Readiness</h1>
          <span class="text-xs text-fog/40" x-show="$store.gw.readiness?.report" x-text="'Checked ' + ($store.gw.readiness?.report?.checked ?? '')"></span>
        </div>

        <!-- The kickoff: five steps, each signed off by the person -->
        <section id="kickoff" class="mt-6">
          <ol class="flex gap-1.5">
            <template x-for="(st, i) in $store.gw.kickoffSteps" :key="st.key">
              <li class="min-w-0 flex-1">
                <button
                  class="flex w-full items-center gap-2 rounded-lg border px-2.5 py-2 text-left"
                  :class="$store.gw.kickoffShown?.key === st.key ? 'border-accent/70 bg-accent/10' : 'border-line hover:border-white/20'"
                  :title="st.done ? 'Done on ' + st.done : st.status"
                  @click="$store.gw.kickoffOpen = st.key"
                >
                  <span
                    class="grid size-5 shrink-0 place-items-center rounded-full text-[11px] font-semibold"
                    :class="st.done ? 'bg-emerald-400/20 text-emerald-300' : $store.gw.kickoffCurrent?.key === st.key ? 'bg-accent text-white' : 'bg-white/8 text-fog/50'"
                  >
                    <template x-if="st.done"><svg class="size-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.75 6 6 9-13.5" /></svg></template>
                    <template x-if="!st.done"><span x-text="i + 1"></span></template>
                  </span>
                  <span class="truncate text-[13px]" :class="st.done || $store.gw.kickoffCurrent?.key === st.key ? 'text-fog' : 'text-fog/55'" x-text="st.name"></span>
                </button>
              </li>
            </template>
          </ol>

          <template x-if="!$store.gw.kickoffShown">
            <div class="mt-3 rounded-lg border border-emerald-400/30 bg-emerald-400/5 p-4">
              <p class="font-medium text-emerald-200" x-text="'Kickoff done on ' + $store.gw.kickoffSteps[4].done + '.'"></p>
              <p class="mt-1 text-fog/70">The map keeps going: capture what comes up while building, and Focus shows what needs you. Click a step to reopen it.</p>
            </div>
          </template>
          <template x-if="$store.gw.kickoffShown">
            <div class="mt-3 rounded-lg border border-line p-4" id="kickoff-step">
              <div class="flex items-baseline justify-between gap-4">
                <h2 class="text-[15px] font-semibold text-fog" x-text="$store.gw.kickoffShown.name"></h2>
                <span class="text-xs" :class="$store.gw.kickoffShown.done ? 'text-emerald-300/80' : 'text-fog/40'" x-text="$store.gw.kickoffShown.done ? 'Done on ' + $store.gw.kickoffShown.done : ''"></span>
              </div>
              <p class="mt-1 text-fog/80" x-text="$store.gw.kickoffShown.status"></p>
              <p class="mt-1 text-fog/55" x-text="$store.gw.kickoffShown.next"></p>

              <template x-if="$store.gw.kickoffShown.key === 'build' && $store.gw.starter">
                <div class="mt-3">
                  <button class="rounded-md border border-line px-3 py-1.5 text-xs text-fog/80 hover:bg-white/8 hover:text-fog" @click="$store.gw.copyText($store.gw.handoffText)" x-text="$store.gw.existingProject ? 'Copy the story rules' : 'Copy CLAUDE.starter.md'"></button>
                </div>
              </template>
              <p x-show="$store.gw.kickoffShown.key === 'build' && !$store.gw.starter" class="mt-2 text-xs text-fog/45">Run /brief first: it writes the starter CLAUDE.md.</p>

              <div class="mt-4 flex items-center gap-2">
                <button
                  x-show="$store.gw.kickoffShown.key === 'answer' && $store.gw.focusQueue.length"
                  class="rounded-md border border-line px-3 py-1.5 text-xs text-fog/80 hover:bg-white/8 hover:text-fog"
                  @click="$store.gw.enterFocus()"
                >Open Focus</button>
                <span class="flex-1"></span>
                <button
                  x-show="$store.gw.kickoffShown.done"
                  class="rounded-md px-3 py-1.5 text-xs text-fog/60 hover:bg-white/8 hover:text-fog"
                  @click="$store.gw.reopenStep($store.gw.kickoffShown.key)"
                >Reopen</button>
                <button
                  x-show="!$store.gw.kickoffShown.done"
                  id="kickoff-done"
                  class="rounded-md bg-accent px-3 py-1.5 text-xs font-medium text-white hover:bg-accent/90"
                  :title="$store.gw.kickoffShown.stale ? 'The files suggest this is not finished, but you decide' : ''"
                  @click="$store.gw.signOff($store.gw.kickoffShown.key)"
                  x-text="$store.gw.kickoffShown.key === 'build' ? 'Done, kickoff complete' : 'Done, move on'"
                ></button>
              </div>
            </div>
          </template>
        </section>

        <template x-if="!$store.gw.readiness?.report">
          <p class="mt-6 rounded-lg border border-line p-4 text-fog/70">Not checked yet. Run <code class="text-fog">/readiness</code> in Claude Code. It judges the map against your checklist and lists what is missing.</p>
        </template>

        <template x-if="$store.gw.readiness?.report">
          <div>
            <div class="mt-4 flex flex-wrap items-center gap-2">
              <span
                class="rounded-md px-2.5 py-1 text-sm font-medium"
                :class="{
                  'bg-emerald-400/15 text-emerald-300': $store.gw.readiness.report.verdict === 'ready to build',
                  'bg-accent/15 text-sky-300': $store.gw.readiness.report.verdict === 'ready to prototype',
                  'bg-question/15 text-question': !['ready to build', 'ready to prototype'].includes($store.gw.readiness.report.verdict)
                }"
                x-text="$store.gw.verdictLabel"
              ></span>
              <span class="text-xs text-fog/45" x-text="$store.gw.openGaps.length + ' open, ' + $store.gw.waitingGaps.length + ' waiting for a check'"></span>
              <span x-show="$store.gw.guessCount" class="rounded-md bg-question/15 px-2 py-0.5 text-xs text-question" x-text="$store.gw.guessCount + ($store.gw.guessCount === 1 ? ' guess' : ' guesses') + ' from /survey to confirm'"></span>
            </div>
            <p x-show="$store.gw.readiness.report.closed.length" id="closed" class="mt-3 text-emerald-300/90">
              <span x-text="'Closed since the last check: ' + $store.gw.readiness.report.closed.join(', ') + '.'"></span>
              <span x-show="$store.gw.readiness.report.added.length" class="text-fog/50" x-text="' New: ' + $store.gw.readiness.report.added.join(', ') + '.'"></span>
            </p>
            <button x-show="$store.gw.focusQueue.length" id="readiness-focus" class="mt-4 rounded-md bg-accent px-3 py-1.5 text-xs font-medium text-white hover:bg-accent/90" @click="$store.gw.enterFocus()" x-text="'Go through what needs you, one at a time (' + $store.gw.focusQueue.length + ')'"></button>
            <p class="mt-3 text-xs text-fog/40">Run <code class="text-fog/70">/readiness</code> to check again, or <code class="text-fog/70">/challenge</code> for questions on the thinnest parts.</p>

            <h2 class="mb-2 mt-8 text-[13px] font-semibold text-fog">Areas</h2>
            <template x-if="$store.gw.areas.length">
              <ul class="divide-y divide-line rounded-lg border border-line" id="areas">
                <template x-for="a in $store.gw.areas" :key="a.name">
                  <li class="flex gap-4 px-4 py-3">
                    <span class="w-36 shrink-0 font-medium text-fog" x-text="a.name"></span>
                    <span
                      class="h-fit w-14 shrink-0 cursor-help rounded py-0.5 text-center text-[11px] font-medium"
                      :class="{ 'bg-rose-400/15 text-rose-300': a.status === 'missing', 'bg-question/15 text-question': a.status === 'thin', 'bg-emerald-400/15 text-emerald-300': a.status === 'enough' }"
                      :title="$store.gw.meaning[a.status]"
                      x-text="a.status"
                    ></span>
                    <span class="text-fog/70" x-text="a.text"></span>
                  </li>
                </template>
              </ul>
            </template>
            <template x-if="!$store.gw.areas.length">
              <div class="report" x-html="$store.gw.reportHtml"></div>
            </template>
          </div>
        </template>

        <template x-if="$store.gw.readiness?.design?.length">
          <div id="design">
            <h2 class="mb-2 mt-8 text-[13px] font-semibold text-fog">Design foundation</h2>
            <template x-for="g in $store.gw.designGroups" :key="g.platform">
              <section class="mb-4">
                <div class="mb-1.5 flex items-baseline justify-between gap-4">
                  <span class="text-[12px] font-medium text-fog/80" x-text="g.platform"></span>
                  <span class="text-xs text-fog/45" x-text="g.score"></span>
                </div>
                <div class="mb-2 h-1.5 overflow-hidden rounded-full bg-white/8">
                  <div class="h-full rounded-full bg-accent" :style="{ width: g.percent + '%' }"></div>
                </div>
                <ul class="divide-y divide-line rounded-lg border border-line">
                  <template x-for="d in g.checks" :key="d.item">
                    <li class="flex gap-4 px-4 py-2.5">
                      <span class="w-36 shrink-0 text-fog" x-text="$store.gw.label(d.item)"></span>
                      <span
                        class="h-fit w-14 shrink-0 cursor-help rounded py-0.5 text-center text-[11px] font-medium"
                        :class="{ 'bg-emerald-400/15 text-emerald-300': d.status === 'found', 'bg-question/15 text-question': d.status === 'partly', 'bg-rose-400/15 text-rose-300': d.status === 'missing' }"
                        :title="$store.gw.meaning[d.status]"
                        x-text="d.status"
                      ></span>
                      <span class="min-w-0 flex-1 text-fog/70">
                        <span x-text="d.note"></span>
                        <span class="mt-1 flex flex-wrap gap-1" x-show="d.seen_in.length">
                          <template x-for="p in d.seen_in" :key="p">
                            <button class="rounded bg-white/8 px-1.5 py-0.5 font-mono text-[10.5px] text-fog/60 hover:bg-white/15 hover:text-fog" title="Copy" @click="$store.gw.copyText(p)" x-text="p"></button>
                          </template>
                        </span>
                      </span>
                    </li>
                  </template>
                </ul>
              </section>
            </template>
          </div>
        </template>

        <template x-if="$store.gw.readiness?.report">
          <div>
            <h2 class="mb-2 mt-8 text-[13px] font-semibold text-fog">Open</h2>
            <p x-show="!$store.gw.openGaps.length" class="text-fog/45">Nothing open.</p>
            <ul class="space-y-1.5" id="gaps-open">
              <template x-for="g in $store.gw.openGaps" :key="g.id">
                <li>
                  <button class="flex w-full items-start gap-3 rounded-lg border border-line px-4 py-3 text-left hover:border-white/20" :class="$store.gw.selectedGapId === g.id && 'border-accent'" @click="$store.gw.selectGap(g.id)">
                    <span class="mt-1.5 size-2 shrink-0 rounded-full" :class="{ 'bg-rose-400': g.severity === 'blocking', 'bg-question': g.severity === 'important', 'bg-white/40': g.severity === 'nice' }"></span>
                    <span class="min-w-0 flex-1">
                      <span class="block font-medium text-fog" x-text="g.title"></span>
                      <span class="block text-fog/55" x-text="g.why"></span>
                    </span>
                    <span class="shrink-0 cursor-help text-[11px] text-fog/40" :title="$store.gw.meaning[g.severity]" x-text="g.severity + ' · ' + $store.gw.label(g.area)"></span>
                  </button>
                </li>
              </template>
            </ul>

            <h2 class="mb-2 mt-8 text-[13px] font-semibold text-fog">Waiting for a check</h2>
            <p x-show="!$store.gw.waitingGaps.length" class="text-fog/45">Nothing waiting. When you answer a gap with "This answers it", it waits here until /readiness has looked at it.</p>
            <ul class="space-y-1.5" id="gaps-waiting">
              <template x-for="g in $store.gw.waitingGaps" :key="g.id">
                <li class="rounded-lg border border-dashed border-line px-4 py-3">
                  <button class="font-medium text-fog/80 hover:text-fog" @click="$store.gw.selectGap(g.id)" x-text="g.title"></button>
                  <span class="block text-fog/55">
                    Answered by
                    <button class="text-accent hover:underline" @click="$store.gw.goToNode(g.answered_by)" x-text="$store.gw.nodes[g.answered_by]?.title ?? g.answered_by"></button>
                  </span>
                </li>
              </template>
            </ul>

            <template x-if="$store.gw.acceptedGaps.length">
              <div>
                <h2 class="mb-2 mt-8 text-[13px] font-semibold text-fog">Accepted for now</h2>
                <ul class="space-y-1" id="gaps-accepted">
                  <template x-for="g in $store.gw.acceptedGaps" :key="g.id">
                    <li><button class="text-fog/60 hover:text-fog" @click="$store.gw.goToNode(g.answered_by)" x-text="g.title"></button></li>
                  </template>
                </ul>
              </div>
            </template>

            <h2 class="mb-2 mt-8 text-[13px] font-semibold text-fog">Settled</h2>
            <p class="mb-3 text-xs text-fog/45">Decisions and settled thoughts, by topic.</p>
            <div class="grid gap-4 sm:grid-cols-2" id="settled">
              <template x-for="g in $store.gw.settledGroups" :key="g.topic">
                <section class="rounded-lg border border-line p-3">
                  <h3 class="mb-1.5 text-[11px] text-fog/45" x-text="$store.gw.label(g.topic) + ' · ' + g.nodes.length"></h3>
                  <template x-for="n in g.nodes" :key="n.id">
                    <button class="flex w-full items-center gap-2 rounded px-1 py-1 text-left text-fog/75 hover:bg-white/5 hover:text-fog" @click="$store.gw.goToNode(n.id)">
                      <span class="size-1.5 shrink-0 rounded-full" :style="{ background: $store.gw.typeColors[n.type] }"></span>
                      <span class="truncate" x-text="n.title"></span>
                    </button>
                  </template>
                </section>
              </template>
            </div>
          </div>
        </template>
      </div>
    </main>

    <!-- Deliverables view -->
    <main
      x-cloak
      x-show="$store.gw.view === 'deliverables'"
      id="deliverables-view"
      class="fixed inset-y-0 left-16 overflow-y-auto bg-ink text-[13px]"
      :style="{ right: $store.gw.detailsVisible ? '360px' : '0px' }"
    >
      <div class="mx-auto max-w-3xl px-8 pb-24 pt-10">
        <div class="flex items-baseline justify-between gap-4">
          <h1 class="text-xl font-semibold text-fog">Deliverables</h1>
          <span class="text-xs text-fog/40" x-show="$store.gw.briefWritten" x-text="'Written ' + $store.gw.briefWritten"></span>
        </div>

        <template x-if="!$store.gw.brief && !$store.gw.stories.length && !$store.gw.survey">
          <p class="mt-6 rounded-lg border border-line p-4 text-fog/70">Nothing yet. Run <code class="text-fog">/brief</code> in Claude Code to turn the map into a brief, a site map, the first stories and a CLAUDE.md to start building with.</p>
        </template>

        <template x-if="$store.gw.brief || $store.gw.stories.length || $store.gw.survey">
          <div>
            <div class="mt-4 flex items-center justify-between gap-4">
              <div class="flex gap-0.5 rounded-lg bg-white/5 p-0.5" id="deliverables-tabs">
                <template x-for="t in $store.gw.deliverableTabs" :key="t[0]">
                  <button
                    class="whitespace-nowrap rounded-md px-3 py-1 text-xs"
                    :class="$store.gw.deliverablesTab === t[0] ? 'bg-white/15 text-fog' : 'text-fog/55 hover:text-fog'"
                    @click="$store.gw.setDeliverablesTab(t[0])"
                    x-text="t[1] + (t[0] === 'stories' ? ' · ' + $store.gw.stories.length : '')"
                  ></button>
                </template>
              </div>
              <span class="text-xs text-fog/40">Run <code class="text-fog/70">/brief</code> again after changing the map.</span>
            </div>

            <div x-show="$store.gw.deliverablesTab === 'survey' && $store.gw.survey" class="report mt-6" id="survey" @click="$store.gw.openIdLink($event)" x-html="$store.gw.surveyHtml"></div>
            <div x-show="$store.gw.deliverablesTab === 'brief'" class="report mt-6" id="brief" @click="$store.gw.openIdLink($event)" x-html="$store.gw.brief ? $store.gw.briefHtml : '<p>No brief yet.</p>'"></div>

            <div x-show="$store.gw.deliverablesTab === 'stories'" class="mt-6 space-y-1.5" id="stories">
              <template x-for="s in $store.gw.stories" :key="s.id">
                <section class="rounded-lg border border-line" :class="$store.gw.openStoryId === s.id && 'border-white/20'">
                  <button class="flex w-full items-center gap-3 px-4 py-3 text-left" @click="$store.gw.openStoryId = $store.gw.openStoryId === s.id ? null : s.id">
                    <span
                      class="shrink-0 rounded px-1.5 py-0.5 text-[11px]"
                      :class="{ 'bg-white/10 text-fog/60': s.status === 'not-started', 'bg-question/15 text-question': s.status === 'partial', 'bg-emerald-400/15 text-emerald-300': s.status === 'done' }"
                      x-text="s.status.replace('-', ' ')"
                    ></span>
                    <span class="min-w-0 flex-1 font-medium text-fog" x-text="s.title"></span>
                    <span class="shrink-0 font-mono text-[11px] text-fog/35" x-text="s.id"></span>
                  </button>
                  <div x-show="$store.gw.openStoryId === s.id" class="border-t border-line px-4 py-3">
                    <p x-show="s.error" class="mb-2 text-xs text-rose-300" x-text="s.error"></p>
                    <div class="report" x-html="$store.gw.storyHtml(s)"></div>
                    <span class="label mt-3">Came from</span>
                    <template x-for="id in s.from" :key="id">
                      <button class="flex h-7 w-full items-center gap-2 rounded px-1 text-left text-fog/75 hover:bg-white/5 hover:text-fog" @click="$store.gw.goToNode(id)">
                        <span class="size-1.5 shrink-0 rounded-full" :style="{ background: $store.gw.nodes[id] ? $store.gw.typeColors[$store.gw.nodes[id].type] : '#666' }"></span>
                        <span class="truncate" x-text="$store.gw.nodes[id]?.title ?? id + ' (not in the map)'"></span>
                      </button>
                    </template>
                    <p x-show="s.applies_to.length" class="mt-2 text-xs text-fog/45" x-text="'Built in: ' + s.applies_to.join(', ')"></p>
                  </div>
                </section>
              </template>
            </div>

            <div x-show="$store.gw.deliverablesTab === 'starter'" class="mt-6" id="starter">
              <div class="mb-3 flex items-center justify-between gap-4 rounded-lg border border-line px-4 py-3">
                <span class="text-fog/70">Put this in the product's repository as CLAUDE.md. Every Claude Code session there starts from it.</span>
                <button id="copy-starter" class="shrink-0 rounded-md bg-accent px-3 py-1 text-xs font-medium text-white hover:bg-accent/90 disabled:opacity-40" :disabled="!$store.gw.starter" @click="$store.gw.copyStarter()" x-text="$store.gw.copied ? 'Copied' : 'Copy'"></button>
              </div>
              <div class="report" x-html="$store.gw.starter ? $store.gw.starterHtml : '<p>No starter yet.</p>'"></div>
            </div>
          </div>
        </template>
      </div>
    </main>

    <!-- Focus: one thing that needs the person at a time, over a dimmed map -->
    <aside
      x-cloak
      x-show="$store.gw.view === 'focus'"
      id="focus"
      class="fixed inset-y-0 right-0 flex w-[400px] max-w-full flex-col border-l border-line bg-panel text-[13px]"
    >
      <div class="flex items-center justify-between px-4 py-3">
        <span class="font-semibold text-fog">Focus</span>
        <span class="-mr-1.5 flex items-center gap-2">
          <span id="focus-count" class="text-xs text-fog/45" x-show="$store.gw.focusQueue.length" x-text="$store.gw.focusQueue.length + ' left'"></span>
          <button class="icon-btn" title="Back to the map ( Esc )" @click="$store.gw.setView('map')">
            <svg class="size-5"><use href="#i-close" /></svg>
          </button>
        </span>
      </div>
      <div class="border-t border-line"></div>

      <div class="flex-1 overflow-y-auto p-5">
        <template x-if="!$store.gw.focusCurrent">
          <div id="focus-done" class="flex flex-col items-start gap-3 pt-6">
            <span class="grid size-10 place-items-center rounded-full bg-emerald-400/15 text-emerald-300">
              <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.75 6 6 9-13.5" /></svg>
            </span>
            <h2 class="text-[17px] font-semibold text-fog">Nothing needs you right now</h2>
            <p class="text-fog/70" x-text="$store.gw.focusNextStep"></p>
            <button class="mt-2 rounded-md px-3 py-1.5 text-xs text-fog/70 hover:bg-white/8 hover:text-fog" @click="$store.gw.setView('map')">Back to the map</button>
          </div>
        </template>

        <template x-if="$store.gw.focusCurrent">
          <div class="flex flex-col gap-5">
            <div x-show="$store.gw.focusOnlySkipped" class="flex items-center justify-between rounded-lg border border-line px-3 py-2 text-xs text-fog/60">
              <span>Only skipped ones are left.</span>
              <button class="text-accent hover:underline" @click="$store.gw.focusRestart()">Start over</button>
            </div>

            <!-- A gap from /readiness -->
            <template x-if="$store.gw.focusGap">
              <div class="flex flex-col gap-4">
                <div>
                  <span
                    class="inline-block rounded px-1.5 py-0.5 text-[11px] font-medium"
                    :class="{ 'bg-rose-400/15 text-rose-300': $store.gw.focusGap.severity === 'blocking', 'bg-question/15 text-question': $store.gw.focusGap.severity === 'important', 'bg-white/10 text-fog/60': $store.gw.focusGap.severity === 'nice' }"
                    :title="$store.gw.meaning[$store.gw.focusGap.severity]"
                    x-text="'Missing · ' + $store.gw.focusGap.severity"
                  ></span>
                  <span class="ml-1 text-[11px] text-fog/45" x-text="$store.gw.label($store.gw.focusGap.area)"></span>
                  <h2 class="mt-2 text-[17px] font-semibold leading-snug text-fog" x-text="$store.gw.focusGap.title"></h2>
                  <p class="mt-1.5 text-fog/70" x-text="$store.gw.focusGap.why"></p>
                </div>
                <div x-show="$store.gw.focusGap.near.some((id) => $store.gw.nodes[id])">
                  <span class="label">Related</span>
                  <template x-for="id in $store.gw.focusGap.near.filter((id) => $store.gw.nodes[id])" :key="id">
                    <p class="flex items-center gap-2 py-1 text-fog/70">
                      <span class="size-1.5 shrink-0 rounded-full" :style="{ background: $store.gw.typeColors[$store.gw.nodes[id].type] }"></span>
                      <span class="truncate" x-text="$store.gw.nodes[id].title"></span>
                    </p>
                  </template>
                </div>
              </div>
            </template>

            <!-- A question from Claude, or a guess from /survey -->
            <template x-if="$store.gw.focusNode">
              <div class="flex flex-col gap-4">
                <div>
                  <span
                    class="inline-block rounded bg-question/15 px-1.5 py-0.5 text-[11px] font-medium text-question"
                    x-text="$store.gw.focusCurrent.kind === 'guess' ? 'Claude\'s guess. Is it right?' : 'Claude asks'"
                  ></span>
                  <span class="ml-1 text-[11px] text-fog/45" x-text="$store.gw.label($store.gw.focusNode.topic || 'no topic')"></span>
                  <h2
                    class="mt-2 text-[17px] font-semibold leading-snug text-fog"
                    x-text="$store.gw.focusCurrent.kind === 'guess' || !$store.gw.focusQuestion ? $store.gw.focusNode.title : $store.gw.focusQuestion.question"
                  ></h2>
                  <p x-show="$store.gw.focusCurrent.kind === 'question'" class="mt-1.5 text-xs text-fog/50" x-text="'On: ' + $store.gw.focusNode.title"></p>
                </div>
                <p x-show="$store.gw.focusNotes" class="line-clamp-6 whitespace-pre-line text-fog/70" x-text="$store.gw.focusNotes"></p>
                <div x-show="$store.gw.seenIn($store.gw.focusNode).length" class="flex flex-wrap items-center gap-1 text-[11px]">
                  <span class="text-fog/50">Seen in</span>
                  <template x-for="p in $store.gw.seenIn($store.gw.focusNode)" :key="p">
                    <button class="rounded bg-white/8 px-1.5 py-0.5 font-mono text-[10.5px] text-fog/70 hover:bg-white/15 hover:text-fog" title="Copy" @click="$store.gw.copyText(p)" x-text="p"></button>
                  </template>
                </div>
                <p x-show="$store.gw.focusCurrent.kind === 'guess' && $store.gw.focusQuestion" class="rounded-lg bg-white/5 px-3 py-2 text-fog/80" x-text="$store.gw.focusQuestion?.question"></p>
              </div>
            </template>

            <!-- Suggestions and options to start from -->
            <div x-show="$store.gw.focusOptions.length" id="focus-options">
              <span class="label">Start from one of these</span>
              <div class="flex flex-col gap-1.5">
                <template x-for="(o, i) in $store.gw.focusOptions" :key="i">
                  <button
                    class="rounded-lg border border-line px-3 py-2 text-left text-fog/85 hover:border-accent/60 hover:bg-accent/10"
                    @click="$store.gw.pickOption(o)"
                  >
                    <span class="block" x-text="o"></span>
                    <span class="mt-0.5 block text-xs text-fog/50" x-show="$store.gw.focusGap?.suggestions?.[i]?.why" x-text="$store.gw.focusGap?.suggestions?.[i]?.why"></span>
                  </button>
                </template>
              </div>
            </div>

            <!-- Answer -->
            <template x-if="$store.gw.focusGap">
              <form @submit.prevent="$store.gw.answerGap(true)">
                <span class="label" x-text="$store.gw.focusOptions.length ? 'Or write your own' : 'Your answer'"></span>
                <textarea
                  id="focus-answer"
                  rows="3"
                  x-model="$store.gw.gapAnswer"
                  @keydown="if ($event.key === 'Enter' && !$event.shiftKey && !$event.isComposing) { $event.preventDefault(); $store.gw.answerGap(true) }"
                  placeholder="It becomes a thought next to the gap"
                  class="field w-full resize-none"
                ></textarea>
                <div class="mt-2 flex items-center gap-2">
                  <button type="button" class="rounded-md px-3 py-1 text-xs text-fog/60 hover:bg-white/8 hover:text-fog" title="Come back to it later" @click="$store.gw.focusSkip()">Skip</button>
                  <span class="flex-1"></span>
                  <button id="focus-enough" type="button" class="rounded-md px-3 py-1 text-xs text-fog/80 hover:bg-white/8 hover:text-fog" title="Accept it as it is. What you wrote is kept as the reason." @click="$store.gw.acceptGap()">Enough for now</button>
                  <button id="focus-submit" type="submit" class="rounded-md bg-accent px-3 py-1 text-xs font-medium text-white hover:bg-accent/90 disabled:opacity-40" :disabled="!$store.gw.gapAnswer.trim()">This answers it</button>
                </div>
              </form>
            </template>
            <template x-if="$store.gw.focusNode">
              <form @submit.prevent="$store.gw.sendReply()">
                <span class="label" x-text="$store.gw.focusCurrent.kind === 'guess' ? 'Or correct it' : $store.gw.focusOptions.length ? 'Or write your own' : 'Your answer'"></span>
                <textarea
                  id="focus-answer"
                  rows="3"
                  x-model="$store.gw.reply"
                  @keydown="if ($event.key === 'Enter' && !$event.shiftKey && !$event.isComposing) { $event.preventDefault(); $store.gw.sendReply() }"
                  :placeholder="$store.gw.focusCurrent.kind === 'guess' ? 'Not quite: ...' : 'A sentence is enough'"
                  class="field w-full resize-none"
                ></textarea>
                <p x-show="$store.gw.replyStatus" class="mt-1 text-xs text-rose-300" x-text="$store.gw.replyStatus"></p>
                <div class="mt-2 flex items-center gap-2">
                  <button type="button" class="rounded-md px-3 py-1 text-xs text-fog/60 hover:bg-white/8 hover:text-fog" title="Come back to it later" @click="$store.gw.focusSkip()">Skip</button>
                  <span class="flex-1"></span>
                  <button x-show="$store.gw.focusCurrent.kind === 'guess'" id="focus-confirm" type="button" class="rounded-md px-3 py-1 text-xs text-emerald-300 hover:bg-emerald-400/15" title="Settle it as it is" @click="$store.gw.confirmGuess()">Yes, that is right</button>
                  <button id="focus-submit" type="submit" class="rounded-md bg-accent px-3 py-1 text-xs font-medium text-white hover:bg-accent/90 disabled:opacity-40" :disabled="!$store.gw.reply.trim() || $store.gw.sending" x-text="$store.gw.focusCurrent.kind === 'guess' ? 'Send correction' : 'Answer'"></button>
                </div>
              </form>
            </template>
          </div>
        </template>
      </div>
    </aside>

    <!-- Details: docked on the right, or a small pill when minimized -->
    <button
      x-cloak
      x-show="($store.gw.selected || $store.gw.selectedGap || $store.gw.selectedStory || $store.gw.reportOpen) && $store.gw.detailsMinimized && $store.gw.view !== 'focus'"
      id="details-tab"
      class="fixed right-3 top-3 flex max-w-[280px] items-center gap-3 rounded-2xl border border-line bg-panel py-2 pl-4 pr-2 text-[13px] shadow-md shadow-black/20"
      title="Show details"
      @click="$store.gw.setDetailsMinimized(false)"
    >
      <span class="truncate text-fog/85" x-text="$store.gw.reportOpen ? 'Readiness report' : $store.gw.selectedGap ? 'Missing: ' + $store.gw.selectedGap.title : $store.gw.selectedStory ? 'Story: ' + $store.gw.selectedStory.title : $store.gw.selected?.title"></span>
      <span class="icon-btn"><svg class="size-5"><use href="#i-panel-right" /></svg></span>
    </button>

    <aside
      x-cloak
      x-show="$store.gw.detailsVisible && $store.gw.view !== 'focus'"
      class="fixed inset-y-0 right-0 flex w-[360px] max-w-full flex-col border-l border-line bg-panel text-[13px]"
    >
      <div class="flex items-center justify-between px-4 py-3">
        <span class="font-semibold text-fog" x-text="$store.gw.reportOpen ? 'Readiness' : $store.gw.selectedGap ? 'Missing' : $store.gw.selectedStory ? 'Story' : 'Details'"></span>
        <span class="-mr-1.5 flex items-center">
          <button id="minimize" class="icon-btn" title="Minimize" @click="$store.gw.setDetailsMinimized(true)">
            <svg class="size-5"><use href="#i-panel-right" /></svg>
          </button>
          <button class="icon-btn" title="Close ( Esc )" @click="$store.gw.closePanel()">
            <svg class="size-5"><use href="#i-close" /></svg>
          </button>
        </span>
      </div>
      <div class="border-t border-line"></div>

      <div class="flex-1 overflow-y-auto p-4">
        <template x-if="$store.gw.reportOpen && $store.gw.readiness?.report">
          <div id="report">
            <p class="mb-3 text-xs text-fog/45" x-text="'Checked ' + $store.gw.readiness.report.checked + ' · ' + $store.gw.readiness.gaps.length + ' gaps'"></p>
            <div class="report" x-html="$store.gw.reportHtml"></div>
            <p class="mt-4 text-xs text-fog/40">Run /readiness in Claude Code to check again, or /challenge for questions on the thinnest parts.</p>
          </div>
        </template>

        <template x-if="$store.gw.selectedStory">
          <div class="flex flex-col gap-4" id="story">
            <div>
              <span
                class="inline-block rounded px-1.5 py-0.5 text-[11px]"
                :class="{ 'bg-white/10 text-fog/60': $store.gw.selectedStory.status === 'not-started', 'bg-question/15 text-question': $store.gw.selectedStory.status === 'partial', 'bg-emerald-400/15 text-emerald-300': $store.gw.selectedStory.status === 'done' }"
                x-text="$store.gw.selectedStory.status.replace('-', ' ')"
              ></span>
              <span class="ml-1 font-mono text-[11px] text-fog/40" x-text="$store.gw.selectedStory.id"></span>
              <h2 class="mt-2 text-[15px] font-semibold leading-snug text-fog" x-text="$store.gw.selectedStory.title"></h2>
            </div>
            <p x-show="$store.gw.selectedStory.error" class="text-xs text-rose-300" x-text="$store.gw.selectedStory.error"></p>
            <div class="report" x-html="$store.gw.storyHtml($store.gw.selectedStory)"></div>
            <div>
              <span class="label">Came from</span>
              <template x-for="id in $store.gw.selectedStory.from" :key="id">
                <button class="flex h-8 w-full items-center gap-2 rounded-md px-1 text-left text-fog/75 hover:bg-white/5 hover:text-fog" @click="$store.gw.goToNode(id)">
                  <span class="size-1.5 shrink-0 rounded-full" :style="{ background: $store.gw.nodes[id] ? $store.gw.typeColors[$store.gw.nodes[id].type] : '#666' }"></span>
                  <span class="truncate" x-text="$store.gw.nodes[id]?.title ?? id + ' (not in the map)'"></span>
                </button>
              </template>
            </div>
            <p x-show="$store.gw.selectedStory.applies_to.length" class="text-xs text-fog/50" x-text="'Built in: ' + $store.gw.selectedStory.applies_to.join(', ')"></p>
            <p class="text-xs text-fog/40">Stories are written by /brief. Change the thinking in the map and run /brief again.</p>
          </div>
        </template>

        <template x-if="$store.gw.selectedGap">
          <div class="flex flex-col gap-4" id="gap">
            <div>
              <span
                class="inline-block rounded px-1.5 py-0.5 text-[11px] font-medium"
                :class="{ 'bg-rose-400/15 text-rose-300': $store.gw.selectedGap.severity === 'blocking', 'bg-question/15 text-question': $store.gw.selectedGap.severity === 'important', 'bg-white/10 text-fog/60': $store.gw.selectedGap.severity === 'nice' }"
                :title="$store.gw.meaning[$store.gw.selectedGap.severity]"
                x-text="$store.gw.selectedGap.severity"
              ></span>
              <span class="ml-1 text-[11px] text-fog/45" x-text="$store.gw.label($store.gw.selectedGap.area)"></span>
              <button
                x-show="$store.gw.view !== 'map'"
                id="gap-show"
                class="float-right rounded-md px-2 py-0.5 text-xs text-accent hover:bg-accent/15"
                @click="$store.gw.showGapInMap($store.gw.selectedGap.id)"
              >Show in map</button>
              <h2 class="mt-2 text-[15px] font-semibold leading-snug text-fog" x-text="$store.gw.selectedGap.title"></h2>
            </div>
            <div>
              <span class="label">Why it matters</span>
              <p class="text-fog/80" x-text="$store.gw.selectedGap.why"></p>
            </div>
            <div x-show="$store.gw.selectedGap.near.some((id) => $store.gw.nodes[id])">
              <span class="label">Near</span>
              <template x-for="id in $store.gw.selectedGap.near.filter((id) => $store.gw.nodes[id])" :key="id">
                <button class="flex h-8 w-full items-center gap-2 rounded-md px-1 text-left text-fog/75 hover:bg-white/5 hover:text-fog" @click="$store.gw.select(id)">
                  <span class="size-1.5 shrink-0 rounded-full" :style="{ background: $store.gw.typeColors[$store.gw.nodes[id].type] }"></span>
                  <span class="truncate" x-text="$store.gw.nodes[id].title"></span>
                </button>
              </template>
            </div>
            <template x-if="$store.gw.selectedGap.answered_by">
              <div class="rounded-lg border border-line px-3 py-2 text-fog/70">
                <span class="label mb-1" x-text="$store.gw.selectedGap.enough ? 'Accepted for now' : 'Answered by'"></span>
                <button class="block w-full text-left text-accent hover:underline" @click="$store.gw.select($store.gw.selectedGap.answered_by)" x-text="$store.gw.nodes[$store.gw.selectedGap.answered_by]?.title ?? $store.gw.selectedGap.answered_by"></button>
                <p x-show="!$store.gw.selectedGap.enough" class="mt-1.5 text-xs text-fog/45">Run /readiness in Claude Code to check whether this closes the gap.</p>
              </div>
            </template>
            <div x-show="!$store.gw.selectedGap.answered_by && $store.gw.selectedGap.suggestions?.length">
              <span class="label">Start from one of these</span>
              <div class="flex flex-col gap-1.5">
                <template x-for="s in $store.gw.selectedGap.suggestions ?? []" :key="s.title">
                  <button class="rounded-lg border border-line px-3 py-2 text-left text-fog/85 hover:border-accent/60 hover:bg-accent/10" :title="s.why" @click="$store.gw.pickOption(s.title)" x-text="s.title"></button>
                </template>
              </div>
            </div>
            <form x-show="!$store.gw.selectedGap.answered_by" @submit.prevent="$store.gw.answerGap(true)">
              <span class="label">Write it here. It becomes a thought next to the gap</span>
              <textarea
                id="gap-answer"
                rows="3"
                x-model="$store.gw.gapAnswer"
                @keydown="if ($event.key === 'Enter' && !$event.shiftKey && !$event.isComposing) { $event.preventDefault(); $store.gw.answerGap(true) }"
                placeholder="For example: Inter, 13px base, 1.25 scale"
                class="field w-full resize-none"
              ></textarea>
              <div class="mt-1.5 flex justify-end gap-2">
                <button id="gap-enough" type="button" class="mr-auto rounded-md px-3 py-1 text-xs text-fog/70 hover:bg-white/8 hover:text-fog" title="Accept it as it is. What you wrote is kept as the reason." @click="$store.gw.acceptGap()">Enough for now</button>
                <button id="gap-note" type="button" class="rounded-md px-3 py-1 text-xs text-fog/70 hover:bg-white/8 hover:text-fog disabled:opacity-40" :disabled="!$store.gw.gapAnswer.trim()" title="Keep the gap open" @click="$store.gw.answerGap(false)">Add as a thought</button>
                <button id="gap-add" type="submit" class="rounded-md bg-accent px-3 py-1 text-xs font-medium text-white hover:bg-accent/90 disabled:opacity-40" :disabled="!$store.gw.gapAnswer.trim()" title="Mark the gap for /readiness to check">This answers it</button>
              </div>
            </form>
          </div>
        </template>

        <template x-if="$store.gw.selected?.error">
          <div class="space-y-3">
            <h2 class="font-medium text-rose-200" x-text="$store.gw.selected.id + '.md cannot be read'"></h2>
            <p class="text-xs text-fog/60" x-text="$store.gw.selected.error"></p>
            <p class="text-xs text-fog/60">Fix the frontmatter in the file by hand. The map updates as soon as it parses again.</p>
            <pre class="whitespace-pre-wrap rounded-md bg-black/30 p-3 text-xs text-fog/70" x-text="$store.gw.selected.body"></pre>
          </div>
        </template>

        <template x-if="$store.gw.selected && !$store.gw.selected.error">
          <div class="flex min-h-full flex-col gap-4">
            <div>
              <h2
                x-show="!$store.gw.editingTitle"
                id="title-text"
                class="-mx-1 cursor-text rounded-md px-1 py-0.5 text-[15px] font-semibold leading-snug text-fog hover:bg-white/5"
                title="Click to edit"
                @click="$store.gw.editingTitle = true"
                x-text="$store.gw.draft.title"
              ></h2>
              <template x-if="$store.gw.editingTitle">
                <textarea
                  id="field-title"
                  rows="3"
                  x-model="$store.gw.draft.title"
                  x-init="$nextTick(() => { $el.focus(); $store.gw.selectTitle ? $el.select() : $el.setSelectionRange($el.value.length, $el.value.length); $store.gw.selectTitle = false })"
                  @input="$store.gw.edit('title')"
                  @focus="$store.gw.focusField('title')"
                  @blur="$store.gw.blurField('title'); $store.gw.editingTitle = false"
                  @keydown.enter.prevent="$event.target.blur()"
                  class="field w-full resize-none text-[15px] font-semibold leading-snug"
                ></textarea>
              </template>
              <template x-if="$store.gw.answeredGap($store.gw.selected)">
                <div id="answers" class="mt-1.5 flex flex-wrap items-center gap-1 text-[11px] text-fog/50">
                  <span>Answer to</span>
                  <button
                    class="rounded px-1.5 py-0.5"
                    :class="$store.gw.answeredGap($store.gw.selected).open ? 'bg-rose-400/15 text-rose-200 hover:bg-rose-400/25' : 'cursor-default bg-white/8 text-fog/60'"
                    :title="$store.gw.answeredGap($store.gw.selected).open ? 'Open the gap' : 'This gap is closed'"
                    @click="$store.gw.answeredGap($store.gw.selected).open && $store.gw.selectGap($store.gw.answeredGap($store.gw.selected).id)"
                    x-text="$store.gw.answeredGap($store.gw.selected).title"
                  ></button>
                  <span x-show="!$store.gw.answeredGap($store.gw.selected).open">(closed)</span>
                </div>
              </template>
              <template x-if="$store.gw.sourceLabel($store.gw.selected)">
                <div id="source" class="mt-1.5 flex flex-wrap items-center gap-1 text-[11px]">
                  <span :class="$store.gw.selected.extra.source === 'inferred' ? 'text-question' : 'text-fog/50'" x-text="$store.gw.sourceLabel($store.gw.selected)"></span>
                  <template x-for="p in $store.gw.seenIn($store.gw.selected)" :key="p">
                    <button class="rounded bg-white/8 px-1.5 py-0.5 font-mono text-[10.5px] text-fog/70 hover:bg-white/15 hover:text-fog" title="Copy" @click="$store.gw.copyText(p)" x-text="p"></button>
                  </template>
                </div>
              </template>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <label class="block">
                <span class="label">Type</span>
                <select id="field-type" x-model="$store.gw.draft.type" @change="$store.gw.edit('type', true)" class="field w-full">
                  <template x-for="t in $store.gw.types" :key="t">
                    <option :value="t" x-text="t" :selected="t === $store.gw.draft.type"></option>
                  </template>
                </select>
              </label>
              <label class="block">
                <span class="label">Status</span>
                <select id="field-status" x-model="$store.gw.draft.status" @change="$store.gw.edit('status', true)" class="field w-full">
                  <template x-for="s in $store.gw.statuses" :key="s">
                    <option :value="s" x-text="s" :selected="s === $store.gw.draft.status"></option>
                  </template>
                </select>
              </label>
            </div>

            <label class="block">
              <span class="label">Page</span>
              <select
                id="field-page"
                x-model="$store.gw.draft.page"
                @change="$store.gw.edit('page', true)"
                class="field w-full"
              >
                <template x-for="p in $store.gw.pageNames" :key="p">
                  <option :value="p" x-text="p" :selected="p === $store.gw.draft.page"></option>
                </template>
              </select>
            </label>

            <label class="block">
              <span class="label">Topic</span>
              <input
                id="field-topic"
                list="topic-names"
                x-model="$store.gw.draft.topic"
                @input="$store.gw.edit('topic')"
                @focus="$store.gw.focusField('topic')"
                @blur="$store.gw.blurField('topic')"
                @keydown.enter.prevent="$event.target.blur()"
                autocomplete="off"
                placeholder="No topic yet"
                class="field w-full"
              />
              <span x-show="$store.gw.selected.extra?.topic_by === 'claude'" class="mt-1 block text-[11px] text-fog/40">Suggested by Claude</span>
              <datalist id="topic-names">
                <template x-for="t in $store.gw.topicNames" :key="t"><option :value="t"></option></template>
              </datalist>
            </label>

            <div>
              <span class="label">Altitude</span>
              <div class="flex gap-0.5 rounded-lg bg-white/5 p-0.5" id="field-altitude">
                <template x-for="a in [1, 2, 3, 4, 5]" :key="a">
                  <button
                    type="button"
                    class="flex-1 rounded-md py-1 text-xs"
                    :class="$store.gw.draft.altitude === a ? 'bg-white/15 text-fog' : 'text-fog/50 hover:text-fog/80'"
                    :data-altitude="a"
                    :title="'Altitude ' + a"
                    @click="$store.gw.draft.altitude = a; $store.gw.edit('altitude', true)"
                    x-text="$store.gw.altitudeWords[a]"
                  ></button>
                </template>
              </div>
            </div>

            <label class="flex flex-1 flex-col">
              <span class="label">Notes</span>
              <textarea
                id="field-body"
                :value="$store.gw.notesText"
                @input="$store.gw.setNotes($event.target.value)"
                @paste="const f = [...$event.clipboardData.files]; if (f.some((x) => x.type.startsWith('image/'))) { $event.preventDefault(); $store.gw.attachImages(f, $el) }"
                @dragover.prevent
                @drop.prevent="$store.gw.attachImages([...$event.dataTransfer.files], $el)"
                @focus="$store.gw.focusField('body')"
                @blur="$store.gw.blurField('body')"
                placeholder="Thoughts, references, half formed questions. Paste or drop images here"
                class="field min-h-28 flex-1 resize-none leading-relaxed"
              ></textarea>
            </label>

            <div x-show="$store.gw.images.length" class="-mt-2 grid grid-cols-3 gap-1.5" id="images">
              <template x-for="src in $store.gw.images" :key="src">
                <a :href="src" target="_blank" rel="noopener" class="block overflow-hidden rounded-md border border-line hover:border-accent">
                  <img :src="src" alt="" class="aspect-[4/3] w-full object-cover" loading="lazy" />
                </a>
              </template>
            </div>

            <div>
              <span class="label">Thread</span>
              <ol class="space-y-2" id="thread">
                <template x-for="(e, i) in $store.gw.thread" :key="i">
                  <li
                    class="rounded-lg border px-3 py-2"
                    :class="e.open ? 'border-question/50 bg-question/10' : e.who === 'you' ? 'border-transparent bg-white/5' : 'border-line'"
                  >
                    <div class="mb-0.5 flex items-center justify-between text-[11px]">
                      <span
                        class="font-medium"
                        :class="e.open ? 'text-question' : e.who === 'you' ? 'text-fog/70' : 'text-accent'"
                        x-text="e.who === 'you' ? 'You' : e.who === 'claude-asks' ? (e.open ? 'Claude asks you' : 'Claude asked') : 'Claude'"
                      ></span>
                      <span class="text-fog/35" x-text="e.date"></span>
                    </div>
                    <p class="whitespace-pre-wrap text-fog/85" x-text="$store.gw.options(e.text).question"></p>
                    <div x-show="$store.gw.options(e.text).options.length" class="mt-2 flex flex-col gap-1">
                      <template x-for="(o, j) in $store.gw.options(e.text).options" :key="j">
                        <button
                          x-show="e.open"
                          class="rounded-md border border-line bg-black/20 px-2.5 py-1.5 text-left text-xs text-fog/85 hover:border-accent/60 hover:bg-accent/10"
                          title="Start your answer from this"
                          @click="$store.gw.reply = o; $nextTick(() => document.getElementById('reply')?.focus())"
                          x-text="o"
                        ></button>
                      </template>
                      <template x-for="(o, j) in $store.gw.options(e.text).options" :key="'c' + j">
                        <span x-show="!e.open" class="text-xs text-fog/50" x-text="'· ' + o"></span>
                      </template>
                    </div>
                  </li>
                </template>
              </ol>
              <form class="mt-2" @submit.prevent="$store.gw.sendReply()">
                <textarea
                  id="reply"
                  rows="2"
                  x-model="$store.gw.reply"
                  @keydown="if ($event.key === 'Enter' && !$event.shiftKey && !$event.isComposing) { $event.preventDefault(); $store.gw.sendReply() }"
                  :placeholder="$store.gw.thread.some((e) => e.open) ? 'Answer Claude' : 'Add a comment'"
                  class="field w-full resize-none"
                ></textarea>
                <div class="mt-1.5 flex items-center justify-between gap-2">
                  <span
                    id="reply-status"
                    class="min-w-0 text-[11px]"
                    :class="$store.gw.replyStatus.startsWith('Not saved') ? 'text-rose-300' : 'text-fog/45'"
                    x-text="$store.gw.replyStatus || 'Enter sends, Shift Enter for a new line'"
                  ></span>
                  <button
                    id="reply-send"
                    type="submit"
                    class="shrink-0 rounded-md bg-accent px-3 py-1 text-xs font-medium text-white hover:bg-accent/90 disabled:opacity-40"
                    :disabled="!$store.gw.reply.trim() || $store.gw.sending"
                  >Send</button>
                </div>
              </form>
            </div>

            <div>
              <span class="label">Links</span>
              <p x-show="$store.gw.linkedNodes.length === 0" class="text-xs text-fog/35">No links yet.</p>
              <ul id="links">
                <template x-for="n in $store.gw.linkedNodes" :key="n.id">
                  <li class="group flex h-8 items-center gap-2 rounded-md px-1 hover:bg-white/5">
                    <span class="size-1.5 shrink-0 rounded-full" :style="{ background: $store.gw.typeColors[n.type] }"></span>
                    <button class="min-w-0 flex-1 truncate text-left text-fog/75 hover:text-fog" @click="$store.gw.select(n.id)" x-text="n.title"></button>
                    <button class="rounded p-0.5 text-fog/40 opacity-0 hover:text-fog group-hover:opacity-100" title="Unlink" @click="$store.gw.toggleLink(n.id)">
                      <svg class="size-4"><use href="#i-close" /></svg>
                    </button>
                  </li>
                </template>
              </ul>
            </div>

            <p class="text-xs text-fog/35" x-text="$store.gw.selected.id + ' · ' + $store.gw.selected.created"></p>
          </div>
        </template>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
