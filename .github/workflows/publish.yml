# Publishes grndwrk to npm when a version tag is pushed (git tag v0.1.0 &&
# git push origin v0.1.0). npm trusts this workflow through trusted
# publishing (set up on npmjs.com under the package's settings), so no npm
# token is stored anywhere, and each release shows provenance: the commit
# and the workflow run it was built from.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The short-lived identity npm checks instead of a token.
  id-token: write

jobs:
  publish:
    # macOS, where the tool is used and tested.
    runs-on: macos-latest
    steps:
      # Actions pinned by commit, so a moved tag cannot change what runs here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 comes with npm 10.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      # The tag must say the version package.json says, so a release is never published under the wrong number.
      - name: Check the tag matches the version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version"
            exit 1
          fi
      # prepack runs the type check, the tests and the build first.
      - run: npm publish
