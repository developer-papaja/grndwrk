# Stages a release of grndwrk on npm when a version tag is pushed (git tag
# v0.1.1 && git push origin v0.1.1). npm trusts this workflow through trusted
# publishing (set up on npmjs.com under the package's settings), so no npm
# token is stored anywhere. The release is staged, not published: it goes
# live when a maintainer approves it on npmjs.com (Staged Packages) with
# their second factor, so nothing reaches users without a person.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The short-lived identity npm checks instead of a token.
  id-token: write

jobs:
  publish:
    # macOS, where the tool is used and tested.
    runs-on: macos-latest
    # The GitHub environment named in the trusted publisher; it only accepts version tags.
    environment: npm
    steps:
      # Actions pinned by commit, so a moved tag cannot change what runs here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing and npm stage need a newer npm than the one Node 22 comes with.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      # The tag must say the version package.json says, so a release is never published under the wrong number.
      - name: Check the tag matches the version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      # The package as users will get it: installed on its own, init, the map answers.
      - run: npm run build
      - run: node scripts/check-package.mjs
      # Packs (prepack builds it) and stages it on npm, to approve on npmjs.com.
      - run: npm stage publish
